[pytest]
# himawari (向日葵) solar-PV actor test config.
# Several cell dirs ship a `test_cell.py`; the legacy `prepend`/`append`
# import modes collide on duplicate basenames. `importlib` resolves each
# test module by its fully-qualified package path (cells.<cell>.test_cell),
# so collection succeeds across all cells.
addopts = --import-mode=importlib -p no:langsmith_plugin
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = cells
