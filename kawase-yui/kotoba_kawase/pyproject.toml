[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kotoba-kawase"
version = "0.1.0"
description = "Religious-corp adherent-to-adherent multi-stable remittance Python facade (kawase-yui per ADR-2605282200, downstream consumer of the kotoba substrate per ADR-2605282300 relocation pattern)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "etzhayyim", email = "council@etzhayyim.com" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["kotoba_kawase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
