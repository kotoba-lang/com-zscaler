<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ameno — run a WASM actor</title>
<!--
  Demo of the ameno WASM-actor surface (ADR-2606015200). Mirrors mountActorPanel:
  resolve actor → fetch WASM → CID-verify (sha256→CIDv1) → run browser-local →
  render. Self-contained (cookie-free, no external resource) so it runs offline:
      python3 -m http.server   # then open this file under the repo
  Live equivalents: WASM via https://etzhayyim.com/ipfs/<cid> (trustless gateway);
  DID via https://etzhayyim.com/actor/<h>/did.json. T2 (dag-pb) actors decline
  here — they run on the donated mesh (e7m-wasm-runner), not the browser.
-->
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,sans-serif;max-width:44rem;padding:2rem 1.1rem;margin-inline:auto}
h1{font-size:1.3rem;margin:0 0 .2rem}.sub{opacity:.7;font-size:.9rem;margin:0 0 1.2rem}
button{font:inherit;padding:.45rem .9rem;border:1px solid currentColor;border-radius:.5rem;background:transparent;color:inherit;cursor:pointer;margin:.2rem .3rem .2rem 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:.86em;background:color-mix(in srgb,currentColor 10%,transparent);padding:.05rem .3rem;border-radius:.3rem;word-break:break-all}
#out{margin-top:1rem}
table{border-collapse:collapse;width:100%}td{padding:.3rem .5rem;border-bottom:1px solid color-mix(in srgb,currentColor 18%,transparent)}
</style>
</head>
<body>
<h1>ameno — run a WASM actor, browser-local</h1>
<p class="sub">No per-actor server. The actor is content-addressed WASM, fetched, CID-verified, and executed here.</p>
<div>
  <button data-actor="tsumugi" data-cid="bafkreidfttpqimwnx4i5a3rswum3orcg3qfa3q7fwts6axgqtcpuokddfi" data-wasm="../../tsumugi/wasm/loader/tsumugi-core.wasm">紡ぎ tsumugi (取-concentration)</button>
  <button data-actor="kanae" data-cid="bafkreielhr6l5jy7ml5l62ncyva34lhjw52q2onwxwy6ubep4wqxjyjnie" data-wasm="../../kanae/wasm/loader/kanae-core.wasm">鼎 kanae (fiscal flow)</button>
  <button data-actor="watatsuna" data-cid="bafybeihusqahaeirwqur64aeh5fvwuoh54cawbmo7smx3h2abvps6li7pa" data-wasm="">綿津綱 watatsuna (T2 — mesh)</button>
</div>
<div id="out"></div>

<script type="module">
// inline (mirrors @etzhayyim/ameno wasm-actor-loader + wasm-actor-panel)
const B32 = "abcdefghijklmnopqrstuvwxyz234567";
function base32(b){let bits=0,v=0,o="";for(const x of b){v=(v<<8)|x;bits+=8;while(bits>=5){o+=B32[(v>>>(bits-5))&31];bits-=5;}}if(bits>0)o+=B32[(v<<(5-bits))&31];return o;}
async function cidV1Raw(buf){const d=new Uint8Array(await crypto.subtle.digest("SHA-256",buf));const c=new Uint8Array(4+d.length);c.set([1,0x55,0x12,0x20],0);c.set(d,4);return "b"+base32(c);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function format(r){const top=r.top||[];const vk=top.length?Object.keys(top[0]).find(k=>typeof top[0][k]==="number"&&k!=="rank"&&k!=="id"):null;const lk=top.length?Object.keys(top[0]).find(k=>typeof top[0][k]==="string"):null;const max=vk?Math.max(...top.map(t=>+t[vk]||0)):1;const rows=top.map(t=>`<tr><td>${esc(t.rank??"")}</td><td><b>${esc(lk?t[lk]:"")}</b></td><td>${esc(vk?t[vk]:"")}</td><td style="width:45%"><div style="height:.5rem;border-radius:1rem;opacity:.55;background:currentColor;width:${max>0?Math.round((+t[vk]||0)/max*100):0}%"></div></td></tr>`).join("");return `<h3>${esc(r.actor)} — ${esc(r.metric||"")}</h3><p class="sub">sourcing: ${esc(r.sourcing||"—")}${r.adjudication?` · adjudication: ${esc(r.adjudication)}`:""}</p><table><tbody>${rows}</tbody></table>`;}
const out = document.getElementById("out");
async function run(btn){
  const cid = btn.dataset.cid, wasm = btn.dataset.wasm;
  if(!wasm){ out.innerHTML = `<p>⚠ <b>${esc(btn.dataset.actor)}</b> is a T2 dag-pb component (<code>${esc(cid)}</code>) — runs on the donated mesh (e7m-wasm-runner / full IPFS node), not browser-local.</p>`; return; }
  out.innerHTML = `<p class="sub">fetch → CID-verify → run…</p>`;
  try{
    const buf = await (await fetch(wasm)).arrayBuffer();
    const got = await cidV1Raw(buf);
    if(got!==cid){ out.innerHTML = `<p>❌ CID mismatch — <code>${esc(got)}</code> ≠ <code>${esc(cid)}</code></p>`; return; }
    const {instance} = await WebAssembly.instantiate(buf,{});
    const {compute,result_ptr,memory} = instance.exports;
    const len = compute();
    const r = JSON.parse(new TextDecoder().decode(new Uint8Array(memory.buffer,result_ptr(),len)));
    out.innerHTML = format(r) + `<p class="sub">ran browser-local · CID-verified (<code>${esc(cid)}</code>) · no server</p>`;
  }catch(e){ out.innerHTML = `<p>⚠ ${esc(e.message)}</p>`; }
}
for(const b of document.querySelectorAll("button[data-actor]")) b.addEventListener("click",()=>run(b));
</script>
</body>
</html>
